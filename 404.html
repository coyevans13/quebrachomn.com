        p { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
        a.home { display: inline-block; background: var(--accent); color: white; padding: 12px 28px; border-radius: 8px; font-weight: 600; text-decoration: none; }
        a.home:hover { filter: brightness(0.95); }
        .hint { margin-top: 24px; font-size: 13px; color: var(--muted); }

</head>
